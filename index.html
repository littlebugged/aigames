<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Neon Arcade — 打开就能玩的浏览器小游戏</title>
    <meta
      name="description"
      content="Neon Arcade 是一个纯浏览器小游戏站。无需下载、无需注册，点击即玩。全部游戏本地运行，加载快、不卡顿。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://example.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Neon Arcade — 打开就能玩的浏览器小游戏" />
    <meta
      property="og:description"
      content="无需下载、无需注册，点击即玩。全部游戏本地运行。"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Neon Arcade</span>
      </a>
      <nav class="site-nav">
        <a href="/#games">全部游戏</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>打开就能玩的小游戏</h1>
        <p class="hero-sub">
          不用下载，不用注册，不用等进度条。全部在你自己的浏览器里跑，关掉页面什么都不留下。
        </p>
      </section>

      <section id="games" class="game-section">
        <h2>全部游戏</h2>
        <div class="game-grid">
          <a class="game-card" href="/games/neon-dash/">
            <div class="game-thumb" data-thumb="neon-dash" aria-hidden="true">
              <span class="thumb-glyph"></span>
            </div>
            <div class="game-body">
              <h3>Neon Dash</h3>
              <p>一根手指就能玩。跳过一个个障碍和坑洞，速度只会越来越快。</p>
              <p class="game-best" data-best-key="neon-dash:best"></p>
              <div class="game-tags">
                <span class="tag">反应</span>
                <span class="tag">休闲</span>
                <span class="tag">无限</span>
              </div>
            </div>
          </a>
          <a class="game-card" href="/games/snake/">
            <div class="game-thumb" data-thumb="snake" aria-hidden="true">
              <span class="thumb-glyph thumb-glyph--snake"></span>
            </div>
            <div class="game-body">
              <h3>Neon Snake</h3>
              <p>经典贪吃蛇。吃光点不断变长，别撞墙也别咬到自己。</p>
              <p class="game-best" data-best-key="neon-snake:best"></p>
              <div class="game-tags">
                <span class="tag">经典</span>
                <span class="tag">休闲</span>
                <span class="tag">竞技</span>
              </div>
            </div>
          </a>
          <a class="game-card" href="/games/star-vanguard/">
            <div class="game-thumb" data-thumb="star-vanguard" aria-hidden="true">
              <span class="thumb-glyph thumb-glyph--star"></span>
            </div>
            <div class="game-body">
              <h3>星穹守卫 Star Vanguard</h3>
              <p>太空射击。抵御小行星与敌机波次，击败 Boss 刷新最高分。</p>
              <p class="game-best" data-best-key="star-vanguard:best"></p>
              <div class="game-tags">
                <span class="tag">射击</span>
                <span class="tag">波次</span>
                <span class="tag">Boss</span>
              </div>
            </div>
          </a>
        </div>
        <p class="more-note">新游戏正在做，会陆续加到这里。</p>
      </section>
    </main>

    <footer class="site-footer">
      <p>Neon Arcade · 所有游戏均在浏览器本地运行</p>
    </footer>

    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
